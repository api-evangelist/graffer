name: Graffer
description: 'Graffer, Inc. (株式会社グラファー) is a Tokyo-based GovTech and generative-AI company
  founded in 2017 whose mission is to change behavior and society through the power
  of products. It operates two pillars: the Graffer Platform, a suite of digital-government
  services for municipalities and national agencies (Smart Application for online
  applications, Procedure Guide, Window Reservation, and Graffer Call AI voice guidance),
  adopted by 179+ Japanese municipalities including Fukuoka, Sapporo, Kyoto, and Oita;
  and Graffer AI Solution, a generative-AI adoption offering for enterprises (consulting,
  training, and the Graffer AI Studio product). Graffer also runs the citizen-facing
  お悩みハンドブック benefits-discovery service and the Govtech Trends media. In 2023 it entered
  a capital and business alliance with Change Holdings. Surfaced as a 500 Global portfolio
  company; no public developer API is currently published.'
